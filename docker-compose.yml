services:
  postgres-db:
    image: postgres:17-alpine
    container_name: instruments-db
    ports:
      - "5432:5432" # Port for DBeaver /  PgAdmin
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - instruments-network
  redis:
    image: redis:7-alpine
    container_name: instruments-redis
    ports:
      - "6379:6379"
    networks:
      - instruments-network
  minio:
    image: minio/minio:latest
    container_name: instruments-minio
    ports:
      - "9000:9000" # Port for MinIO
      - "9001:9001" # Port for MinIO Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    networks:
      - instruments-network
    volumes:
      - minio-data:/data
volumes:
  postgres-data:
  minio-data:
networks:
  instruments-network: